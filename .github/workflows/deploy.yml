name: Deploy to GitHub Pages & CloudBase

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Validate and package public files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Checks and packaging use only Node built-ins; no website dependencies to install.
      - run: npm run prepare:release
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-github-pages:
    name: Deploy GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployment.js

  deploy-cloudbase:
    name: Deploy Tencent CloudBase
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist/
      - name: Install pinned CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.1 --no-fund --no-audit
      - name: Authenticate and deploy public files only
        env:
          TCB_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: |
          test -n "$TCB_SECRET_ID" && test -n "$TCB_SECRET_KEY" && test -n "$TCB_ENV_ID"
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy ./dist / --env-id "$TCB_ENV_ID"
      - name: Verify published release
        env:
          SITE_URL: https://academic-4gpadgfs73617168-1258930043.tcloudbaseapp.com/
        run: node scripts/verify-deployment.js
