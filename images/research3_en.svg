<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Invasive neural interface chips and systems: recording, on-chip processing and wireless telemetry</title>
<desc id="desc">Conceptual overview: implanted microelectrodes connect to a neural recording chip, with multichannel low-noise acquisition, event-driven sampling and data compression, followed by wireless telemetry to an external receiver and decoding platform. The modules summarize research themes rather than the exact integration or scale of a particular device.</desc>
